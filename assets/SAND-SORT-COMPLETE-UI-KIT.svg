<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400">
  <defs>
    <linearGradient id="daySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eb8ff"/><stop offset="45%" stop-color="#87ceeb"/>
      <stop offset="72%" stop-color="#c4a574"/><stop offset="100%" stop-color="#d4a84b"/>
    </linearGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061018"/><stop offset="50%" stop-color="#0a1a38"/><stop offset="100%" stop-color="#1a3048"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE65D"/><stop offset="100%" stop-color="#E5B800"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4C2C2"/><stop offset="100%" stop-color="#C68642"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20B2AA"/><stop offset="100%" stop-color="#005C5C"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FFFD4"/><stop offset="100%" stop-color="#2E8B57"/>
    </linearGradient>
    <linearGradient id="amethyst" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BA55D3"/><stop offset="100%" stop-color="#6A0DAD"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90ff"/><stop offset="100%" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity=".25"/><stop offset="100%" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="2400" fill="#0a1628"/>
  <text x="60" y="70" fill="#fff" font-family="Arial Black,sans-serif" font-size="40">SAND SORT PUZZLE � COMPLETE UI KIT</text>
  <text x="60" y="108" fill="#c8d6e8" font-family="Arial" font-size="16">Day/Night desert � 10 bottles � glitter sands � HUD � splash � modals � pour states</text>

  <!-- Split day/night hero -->
  <g transform="translate(60,140)">
    <clipPath id="dayHalf"><rect width="840" height="320" rx="20"/></clipPath>
    <g clip-path="url(#dayHalf)">
      <rect width="840" height="320" fill="url(#daySky)"/>
      <circle cx="140" cy="90" r="42" fill="#ffd93b"/>
      <path d="M0 220 Q210 160 420 230 Q630 290 840 210 L840 320 L0 320 Z" fill="#c9953a"/>
      <path d="M0 260 Q300 220 840 270 L840 320 L0 320 Z" fill="#e0b04a"/>
      <text x="40" y="50" fill="#fff" font-family="Arial Black" font-size="22">DAY DESERT</text>
    </g>
    <clipPath id="nightHalf"><rect x="860" width="840" height="320" rx="20"/></clipPath>
    <g clip-path="url(#nightHalf)">
      <rect x="860" width="840" height="320" fill="url(#nightSky)"/>
      <circle cx="1580" cy="80" r="34" fill="#f0f4ff"/>
      <circle cx="1595" cy="72" r="30" fill="#0a1a38"/>
      <circle cx="940" cy="60" r="2" fill="#fff"/><circle cx="1020" cy="100" r="1.5" fill="#fff"/>
      <circle cx="1100" cy="50" r="2" fill="#fff"/><circle cx="1300" cy="90" r="1.5" fill="#fff"/>
      <circle cx="1450" cy="130" r="2" fill="#fff"/>
      <path d="M860 220 Q1100 170 1300 240 Q1500 290 1700 210 L1700 320 L860 320 Z" fill="#1a3048"/>
      <text x="900" y="50" fill="#fff" font-family="Arial Black" font-size="22">NIGHT DESERT</text>
    </g>
  </g>

  <!-- Sand palette -->
  <g transform="translate(60,500)">
    <text x="0" y="0" fill="#FFD700" font-family="Arial Black" font-size="24">GLITTER SAND PALETTE</text>
    <g transform="translate(0,30)">
      <rect width="300" height="90" rx="14" fill="url(#gold)"/><text x="16" y="115" fill="#fff" font-size="14" font-family="Arial" font-weight="700">Gold #FFD700</text>
      <rect x="320" width="300" height="90" rx="14" fill="url(#rose)"/><text x="336" y="115" fill="#fff" font-size="14" font-family="Arial" font-weight="700">Rose Gold #E0A96D</text>
      <rect x="640" width="300" height="90" rx="14" fill="url(#teal)"/><text x="656" y="115" fill="#fff" font-size="14" font-family="Arial" font-weight="700">Teal #008080</text>
      <rect x="960" width="300" height="90" rx="14" fill="url(#emerald)"/><text x="976" y="115" fill="#fff" font-size="14" font-family="Arial" font-weight="700">Emerald #50C878</text>
      <rect x="1280" width="300" height="90" rx="14" fill="url(#amethyst)"/><text x="1296" y="115" fill="#fff" font-size="14" font-family="Arial" font-weight="700">Amethyst #9966CC</text>
    </g>
  </g>

  <!-- 10 bottles -->
  <g transform="translate(60,700)">
    <text x="0" y="0" fill="#7FFFD4" font-family="Arial Black" font-size="24">BOTTLE LIBRARY (10 SHAPES)</text>
    <!-- simplified labeled bottles -->
    <g font-family="Arial" font-size="12" fill="#c8d6e8">
      <g transform="translate(20,40)"><rect x="18" y="20" width="28" height="110" rx="14" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="22" y="50" width="20" height="70" fill="url(#gold)"/><text y="150" x="0">1 Test Tube</text></g>
      <g transform="translate(180,40)"><path d="M30 20 h20 v20 L70 130 h-50 L30 40 Z" fill="url(#glass)" stroke="#fff" stroke-width="2"/><path d="M34 70 L62 120 h-40 Z" fill="url(#rose)"/><text y="150" x="0">2 Erlenmeyer</text></g>
      <g transform="translate(360,40)"><circle cx="40" cy="100" r="36" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="32" y="20" width="16" height="50" fill="url(#glass)" stroke="#fff" stroke-width="2"/><circle cx="40" cy="100" r="28" fill="url(#teal)"/><text y="150" x="0">3 Round Flask</text></g>
      <g transform="translate(540,40)"><rect x="20" y="30" width="40" height="100" rx="4" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="30" y="10" width="20" height="24" rx="3" fill="#d8ecff"/><rect x="24" y="60" width="32" height="60" fill="url(#emerald)"/><text y="150" x="0">4 Apothecary</text></g>
      <g transform="translate(720,40)"><path d="M32 20 h16 v40 Q70 70 70 110 Q70 145 40 145 Q10 145 10 110 Q10 70 32 60 Z" fill="url(#glass)" stroke="#fff" stroke-width="2"/><ellipse cx="40" cy="115" rx="24" ry="22" fill="url(#amethyst)"/><text y="150" x="0">5 Bulb</text></g>
      <g transform="translate(900,40)"><rect x="28" y="20" width="24" height="110" rx="8" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="8" y="50" width="16" height="40" rx="6" fill="url(#glass)" stroke="#fff"/><rect x="56" y="45" width="16" height="36" rx="6" fill="url(#glass)" stroke="#fff"/><rect x="32" y="70" width="16" height="50" fill="url(#gold)"/><text y="150" x="0">6 Cactus</text></g>
      <g transform="translate(1080,40)"><path d="M20 20 Q40 50 40 70 Q40 90 60 120 Q40 145 20 120 Q40 90 40 70 Q40 50 60 20 Z" fill="url(#glass)" stroke="#fff" stroke-width="2"/><ellipse cx="40" cy="40" rx="14" ry="10" fill="url(#teal)"/><ellipse cx="40" cy="120" rx="14" ry="12" fill="url(#gold)"/><text y="150" x="0">7 Hourglass</text></g>
      <g transform="translate(1260,40)"><rect x="18" y="20" width="44" height="110" rx="4" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="22" y="90" width="36" height="30" fill="url(#amethyst)"/><rect x="22" y="60" width="36" height="30" fill="url(#emerald)"/><text y="150" x="0">8 Square</text></g>
      <g transform="translate(1440,40)"><path d="M30 30 Q50 10 55 40 Q70 50 60 90 Q50 130 30 120 Q10 90 20 50 Q25 20 30 30 Z" fill="url(#glass)" stroke="#fff" stroke-width="2"/><ellipse cx="40" cy="95" rx="18" ry="20" fill="url(#rose)"/><text y="150" x="0">9 Perfume</text></g>
      <g transform="translate(1620,40)"><rect x="16" y="20" width="48" height="110" rx="6" fill="url(#glass)" stroke="#fff" stroke-width="2"/><path d="M64 28 L78 18 L68 40" fill="#fff" opacity=".4"/><rect x="20" y="70" width="40" height="50" fill="url(#teal)"/><rect x="20" y="50" width="40" height="20" fill="url(#gold)"/><text y="150" x="0">10 Beaker</text></g>
    </g>
  </g>

  <!-- States -->
  <g transform="translate(60,920)">
    <text x="0" y="0" fill="#F4C2C2" font-family="Arial Black" font-size="24">BOTTLE STATES</text>
    <g transform="translate(0,40)" font-family="Arial" font-size="13" fill="#c8d6e8">
      <g><rect width="200" height="220" rx="16" fill="#122038"/><rect x="80" y="40" width="40" height="130" rx="16" fill="url(#glass)" stroke="#fff" stroke-width="2"/><text x="60" y="200">Empty</text></g>
      <g transform="translate(220,0)"><rect width="200" height="220" rx="16" fill="#122038"/><rect x="80" y="40" width="40" height="130" rx="16" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="84" y="70" width="32" height="90" fill="url(#gold)"/><text x="50" y="200">Fully Filled</text></g>
      <g transform="translate(440,0)"><rect width="200" height="220" rx="16" fill="#122038"/><rect x="80" y="30" width="40" height="130" rx="16" fill="url(#glass)" stroke="#7EC8FF" stroke-width="3"/><rect x="84" y="80" width="32" height="70" fill="url(#rose)"/><text x="40" y="200">Selected / Lifted</text></g>
      <g transform="translate(660,0)"><rect width="200" height="220" rx="16" fill="#122038"/><rect x="80" y="50" width="40" height="120" rx="16" fill="url(#glass)" stroke="#FFD700" stroke-width="2.5"/><rect x="84" y="60" width="32" height="100" fill="url(#gold)"/><ellipse cx="100" cy="52" rx="18" ry="8" fill="#FFE65D"/><circle cx="85" cy="30" r="3" fill="#FFD700"/><circle cx="110" cy="25" r="2.5" fill="#fff"/><circle cx="95" cy="18" r="2" fill="#FFD700"/><text x="35" y="200">Victory Overflow</text></g>
      <g transform="translate(880,0)"><rect width="360" height="220" rx="16" fill="#122038"/>
        <g transform="translate(80,40) rotate(-50)"><rect width="36" height="110" rx="14" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="4" y="40" width="28" height="60" fill="url(#gold)"/></g>
        <ellipse cx="175" cy="70" rx="5" ry="8" fill="#FFD700"/><ellipse cx="180" cy="90" rx="4" ry="7" fill="#FFE65D"/><ellipse cx="176" cy="110" rx="4.5" ry="7" fill="#FFD700"/>
        <rect x="220" y="50" width="40" height="120" rx="16" fill="url(#glass)" stroke="#7EC8FF" stroke-width="2"/><rect x="224" y="100" width="32" height="60" fill="url(#gold)"/>
        <text x="100" y="200">Pour / Cascade Drip</text>
      </g>
    </g>
  </g>

  <!-- HUD -->
  <g transform="translate(60,1200)">
    <text x="0" y="0" fill="#20B2AA" font-family="Arial Black" font-size="24">HUD &amp; UI ELEMENTS</text>
    <g transform="translate(0,40)">
      <rect width="1680" height="120" rx="20" fill="#122038"/>
      <!-- icons -->
      <g transform="translate(40,30)" fill="none" stroke="#fff" stroke-width="2"><circle cx="20" cy="20" r="18" fill="rgba(20,32,58,.7)" stroke="#ffffff55"/><path d="M14 20 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0" stroke="#c8d0dc"/><text x="-10" y="55" fill="#c8d6e8" font-size="11" font-family="Arial" stroke="none">Settings</text></g>
      <g transform="translate(140,30)"><circle cx="20" cy="20" r="18" fill="rgba(20,32,58,.7)" stroke="#ffffff55"/><path d="M12 22 L20 14 L28 22 V32 H12 Z" fill="#fff"/><text x="-2" y="55" fill="#c8d6e8" font-size="11" font-family="Arial">Home</text></g>
      <g transform="translate(700,20)" text-anchor="middle"><text x="100" y="28" fill="#fff" font-family="Arial Black" font-size="26">Level 45</text><text x="70" y="52" fill="#FFD700" font-size="18">?</text><text x="95" y="52" fill="#FFD700" font-size="18">?</text><text x="120" y="52" fill="#FFD700" font-size="18">?</text></g>
      <g transform="translate(1400,30)"><circle cx="20" cy="20" r="18" fill="rgba(20,32,58,.7)" stroke="#ffffff55"/><path d="M12 20 a8 8 0 1 0 8 -8" stroke="url(#cta)" stroke-width="2.5" fill="none"/><text x="-5" y="55" fill="#c8d6e8" font-size="11" font-family="Arial">Restart</text></g>
      <g transform="translate(1520,30)"><circle cx="20" cy="20" r="18" fill="rgba(20,32,58,.7)" stroke="#ffffff55"/><path d="M14 34 h12 M20 10 a8 8 0 0 0 -4 14 v3 h8 v-3 a8 8 0 0 0 -4 -14z" fill="#FFD700"/><text x="2" y="55" fill="#c8d6e8" font-size="11" font-family="Arial">Hint</text></g>
    </g>
    <g transform="translate(0,190)">
      <rect width="280" height="70" rx="18" fill="rgba(20,32,58,.72)" stroke="#ffffff44" stroke-width="1.5"/>
      <text x="90" y="42" fill="#fff" font-family="Arial" font-weight="800" font-size="16">UNDO</text>
      <rect x="300" width="280" height="70" rx="18" fill="rgba(20,32,58,.72)" stroke="#ffffff44" stroke-width="1.5"/>
      <text x="400" y="42" fill="#fff" font-family="Arial" font-weight="800" font-size="16">HINT</text>
      <rect x="600" width="360" height="70" rx="35" fill="url(#cta)"/>
      <text x="700" y="42" fill="#fff" font-family="Arial" font-weight="800" font-size="18">+ ADD TUBE</text>
      <!-- sound toggle -->
      <rect x="1020" y="15" width="100" height="40" rx="20" fill="#4a90ff"/>
      <circle cx="1090" cy="35" r="16" fill="#fff"/>
      <text x="1140" y="42" fill="#c8d6e8" font-family="Arial" font-size="14">Sound / Music ON</text>
    </g>
  </g>

  <!-- Screens -->
  <g transform="translate(60,1520)">
    <text x="0" y="0" fill="#BA55D3" font-family="Arial Black" font-size="24">SCREENS &amp; POPUPS</text>

    <!-- Splash -->
    <g transform="translate(0,40)">
      <rect width="360" height="640" rx="28" fill="url(#daySky)"/>
      <circle cx="80" cy="90" r="36" fill="#ffd93b"/>
      <path d="M0 420 Q120 360 220 430 Q300 480 360 400 L360 640 L0 640 Z" fill="#c9953a"/>
      <text x="180" y="240" text-anchor="middle" fill="#fff" font-family="Arial Black" font-size="36">SAND</text>
      <text x="180" y="285" text-anchor="middle" fill="#FFD700" font-family="Arial Black" font-size="36">SORT</text>
      <text x="180" y="320" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800" font-size="16" letter-spacing="4">PUZZLE</text>
      <text x="100" y="700" fill="#c8d6e8" font-family="Arial" font-size="14">Splash Screen</text>
    </g>

    <!-- Level Cleared day -->
    <g transform="translate(420,40)">
      <rect width="360" height="640" rx="28" fill="url(#daySky)"/>
      <rect x="40" y="180" width="280" height="300" rx="22" fill="rgba(255,255,255,.28)" stroke="#ffffff88" stroke-width="2"/>
      <text x="180" y="230" text-anchor="middle" fill="#fff" font-family="Arial Black" font-size="22">LEVEL CLEARED!</text>
      <text x="140" y="275" fill="#FFD700" font-size="28">?</text>
      <text x="170" y="270" fill="#FFD700" font-size="34">?</text>
      <text x="205" y="275" fill="#FFD700" font-size="28">?</text>
      <circle cx="120" cy="320" r="10" fill="#FFD700"/><text x="140" y="326" fill="#fff" font-family="Arial" font-size="14">Coins Earned: 50</text>
      <rect x="70" y="360" width="220" height="44" rx="22" fill="url(#cta)"/><text x="180" y="388" text-anchor="middle" fill="#fff" font-weight="800" font-family="Arial">Next Level</text>
      <rect x="70" y="420" width="220" height="44" rx="22" fill="#9b5cff"/><text x="180" y="448" text-anchor="middle" fill="#fff" font-weight="800" font-family="Arial">Main Menu</text>
      <text x="80" y="700" fill="#c8d6e8" font-family="Arial" font-size="14">Level Cleared (Day)</text>
    </g>

    <!-- Pause night -->
    <g transform="translate(840,40)">
      <rect width="360" height="640" rx="28" fill="url(#nightSky)"/>
      <circle cx="280" cy="90" r="28" fill="#f0f4ff"/><circle cx="292" cy="82" r="24" fill="#0a1a38"/>
      <circle cx="60" cy="70" r="2" fill="#fff"/><circle cx="120" cy="110" r="1.5" fill="#fff"/><circle cx="200" cy="60" r="2" fill="#fff"/>
      <rect x="50" y="200" width="260" height="240" rx="22" fill="rgba(12,20,40,.62)" stroke="#b4c8ff55" stroke-width="2"/>
      <text x="180" y="260" text-anchor="middle" fill="#fff" font-family="Arial Black" font-size="28">PAUSE</text>
      <rect x="80" y="300" width="200" height="44" rx="22" fill="rgba(40,48,64,.92)" stroke="#ffffff30"/><text x="180" y="328" text-anchor="middle" fill="#fff" font-weight="800" font-family="Arial">Resume</text>
      <rect x="80" y="360" width="200" height="44" rx="22" fill="rgba(40,48,64,.92)" stroke="#ffffff30"/><text x="180" y="388" text-anchor="middle" fill="#fff" font-weight="800" font-family="Arial">Quit to Map</text>
      <text x="90" y="700" fill="#c8d6e8" font-family="Arial" font-size="14">Pause (Night)</text>
    </g>

    <!-- Gameplay phone -->
    <g transform="translate(1260,40)">
      <rect width="360" height="640" rx="28" fill="url(#daySky)"/>
      <text x="180" y="70" text-anchor="middle" fill="#fff" font-family="Arial Black" font-size="20">Level 45</text>
      <text x="155" y="92" fill="#FFD700" font-size="14">???</text>
      <g transform="translate(50,160)">
        <rect x="20" y="20" width="36" height="110" rx="14" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="24" y="50" width="28" height="70" fill="url(#gold)"/>
        <rect x="90" y="20" width="36" height="110" rx="14" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="94" y="70" width="28" height="50" fill="url(#teal)"/>
        <rect x="160" y="20" width="36" height="110" rx="14" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="164" y="40" width="28" height="80" fill="url(#amethyst)"/>
        <rect x="50" y="160" width="36" height="110" rx="14" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="54" y="200" width="28" height="60" fill="url(#rose)"/>
        <rect x="130" y="160" width="36" height="110" rx="14" fill="url(#glass)" stroke="#7EC8FF" stroke-width="2.5"/>
      </g>
      <rect x="40" y="520" width="280" height="50" rx="25" fill="url(#cta)"/><text x="180" y="552" text-anchor="middle" fill="#fff" font-weight="800" font-family="Arial">+ ADD TUBE</text>
      <text x="90" y="700" fill="#c8d6e8" font-family="Arial" font-size="14">Gameplay (Day)</text>
    </g>
  </g>

  <text x="60" y="2340" fill="#7FFFD4" font-family="Arial" font-size="15">Drag into Figma � File: assets/SAND-SORT-COMPLETE-UI-KIT.svg � Also see ANIMATION-STORYBOARD-DRIP.svg</text>
</svg>
